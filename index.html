<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="application-version" content="20261125.3" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Midwinter</title>
  <link rel="icon" href="data:," />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030612;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef2ff;
      overscroll-behavior: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #hud-anchor {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      padding: 0 20px;
      pointer-events: none;
    }

    #dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(8, 12, 24, 0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0.68;
      transition: opacity 0.28s ease, background 0.28s ease;
    }

    #dock:hover,
    #dock.editing {
      opacity: 0.96;
      background: rgba(10, 16, 32, 0.82);
    }

    .orbs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .orb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      opacity: 0.78;
      flex-shrink: 0;
      transition: transform 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
    }

    .orb:hover {
      transform: scale(1.22);
      opacity: 1;
    }

    .orb.active {
      opacity: 1;
      transform: scale(1.18);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.88), 0 0 10px currentColor;
    }

    .sep {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
    }

    .ico-btn {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(235, 242, 255, 0.78);
      font-size: 13px;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .ico-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .ico-btn.on {
      color: #fde68a;
    }

    #plaque-anchor {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      z-index: 22;
      display: flex;
      justify-content: flex-end;
      padding: 0 20px;
      pointer-events: none;
    }

    #plaque-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 12px;
      background: rgba(10, 16, 32, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #plaque-box.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #plaque-input {
      width: 175px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      padding: 4px 2px;
      color: #fff8e6;
      font-size: 12px;
      letter-spacing: 1.2px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    #plaque-input:focus {
      border-bottom-color: #fde68a;
    }

    #plaque-eye {
      border: none;
      background: transparent;
      color: rgba(255, 240, 200, 0.85);
      font-size: 13px;
      cursor: pointer;
      padding: 3px 5px;
    }

    #plaque-eye.muted {
      opacity: 0.35;
    }

    @media (max-width: 680px) {
      #hud-anchor {
        justify-content: center;
        padding: 0 10px;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      }

      #dock {
        padding: 7px 10px;
        gap: 6px;
        opacity: 0.88;
      }

      .orbs {
        gap: 6px;
      }

      .orb {
        width: 13px;
        height: 13px;
      }

      .ico-btn {
        width: 26px;
        height: 26px;
        line-height: 26px;
        font-size: 13px;
      }

      #plaque-anchor {
        justify-content: center;
        padding: 0 12px;
        bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      }
    }

    #webgl-error {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: #030612;
      padding: 24px;
      text-align: center;
      color: #cbd5f0;
      font-size: 14px;
    }

    #webgl-error.show {
      display: flex;
    }
  
    button:focus-visible { outline: 2px solid #e9d4a1; outline-offset: 4px; }
    .orb { width: 28px; height: 32px; background-clip: content-box !important; padding: 8px 6px; border-radius: 50%; }
    .orb.active { box-shadow: none; outline: 1px solid #d9c9a577; outline-offset: -2px; }
    .ico-btn { width: 36px; height: 36px; line-height: 36px; font-size: 17px; }
    #dock { gap: 5px; opacity: .82; background: rgba(9,15,22,.6); }
    #plaque-input { font-size: 16px; width: 205px; }
    #plaque-anchor { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
    #plaque-eye { min-width: 40px; min-height: 40px; }
    #toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); color: #e5d7bc; font-size: 12px; letter-spacing: .12em; pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 30; white-space: nowrap; }
    #toast.show { opacity: 1; }
    @media(max-width:680px) {
      #dock { width: 300px; justify-content: center; flex-wrap: wrap; gap: 2px 5px; padding: 5px 9px; border-radius: 25px; }
      .orbs { width: 100%; justify-content: center; gap: 12px; }
      .orb { width: 28px; height: 28px; }
      .ico-btn { width: 40px; height: 40px; line-height: 40px; font-size: 17px; }
      .sep { display: none; }
      #plaque-anchor { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
      #toast { bottom: 128px; }
    }
    @media(prefers-reduced-motion:reduce) { * { transition: none !important; } }
  
    #hud-anchor { justify-content: center; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    #dock { width: auto; flex-wrap: nowrap; border-color: rgba(229,207,161,.18); background: rgba(12,24,25,.62); gap: 5px; padding: 5px 10px; border-radius: 28px; opacity: .92; }
    .ico-btn { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; color: #d5cdb9; position: relative; }
    .ico-btn svg,#plaque-eye svg { width: 20px; height: 20px; }
    .ico-btn.on { color: #f4d49a; background: rgba(230,189,111,.10); }
    .ico-btn:hover { background: rgba(230,189,111,.13); color: #fff1d4; transform: translateY(-2px); }
    .ico-btn:active { transform: scale(.92); }
    #plaque-anchor { justify-content: center; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    #plaque-box { border-color: rgba(229,207,161,.2); background: rgba(12,24,25,.92); }
    #plaque-eye { display: inline-flex; align-items: center; justify-content: center; }
    #toast { bottom: 98px; }
    @media(max-width:680px){ #dock { gap: 3px; padding: 4px 7px; } #hud-anchor { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); } .ico-btn { width: 42px; height: 42px; } }
  </style>

  <script type="x-shader/x-vertex" id="voxel-vs">
    attribute vec2 aCol;
    attribute vec4 aData;
    #ifdef MODE_DEER
    attribute vec3 aPivot;
    attribute vec3 aJoint;
    #endif

    uniform float uTime;
    uniform float uT;
    uniform float uScanY;
    uniform float uAurora;
    uniform float uPulseT;
    uniform float uTreeH;
    uniform float uReveal;
    uniform float uRuneOn;
    uniform float uStarFlash;
    uniform float uGiftOpen[6];
    uniform vec3 uPalette[8];

    varying vec3 vNormal;
    varying vec3 vLocal;
    varying vec3 vBaseCol;
    varying float vShade;
    varying float vFlash;
    varying vec3 vExtraGlow;
    varying float vDepth;

    float easeOutCubic(float x) {
      float t = 1.0 - x;
      return 1.0 - t * t * t;
    }

    float easeOutSoftBack(float x) {
      float c1 = 0.72;
      float c3 = c1 + 1.0;
      float t = x - 1.0;
      return 1.0 + c3 * t * t * t + c1 * t * t;
    }

    float easeSoftDrop(float x) {
      if (x <= 0.0) return 0.0;
      if (x >= 1.0) return 1.0;
      float drop = easeOutCubic(min(x / 0.74, 1.0));
      float bounce = sin(max(0.0, x - 0.74) / 0.26 * 3.14159265) * 0.045 * (1.0 - x);
      return drop - bounce;
    }

    vec3 hue2rgb(float h) {
      vec3 p = abs(fract(h + vec3(0.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0);
      return clamp(p - 1.0, 0.0, 1.0);
    }

    vec3 getPal(int idx) {
      vec3 c = uPalette[0];
      for (int i = 1; i < 8; i++) {
        if (i == idx) c = uPalette[i];
      }
      return c;
    }

    vec3 rotX(vec3 v, float a) {
      float c = cos(a);
      float s = sin(a);
      return vec3(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
    }

    void main() {
      int slot = int(clamp(aCol.x + 0.5, 0.0, 7.0));
      vBaseCol = getPal(slot);
      vShade = aCol.y;
      vLocal = position;
      vFlash = 0.0;
      vExtraGlow = vec3(0.0);

      vec3 n = normal;
      float sMul = 1.0;
      vec4 localInstPos = instanceMatrix * vec4(position, 1.0);
      vec3 center = vec3(instanceMatrix[3].xyz);

      #ifdef MODE_TREE
        float y = aData.x;
        float p = clamp((uScanY - y) / 2.0, 0.0, 1.0);
        float sp = smoothstep(0.0, 1.0, p);
        sMul = p > 0.001 ? easeOutSoftBack(sp) : 0.0;
        localInstPos = instanceMatrix * vec4(position * sMul, 1.0);
        vec3 targetCenter = mix(vec3(center.x * 0.25, center.y, center.z * 0.25), center, easeOutCubic(sp));
        localInstPos.xyz += (targetCenter - center);

        vFlash = pow(1.0 - sp, 2.6) * step(0.001, p) * 0.92;

        float angle = atan(center.z, center.x);
        if (uAurora > 0.001) {
          float aur = clamp(uAurora, 0.0, 1.0);
          float front = aur < 0.45
            ? (aur / 0.45) * uTreeH
            : uTreeH * (1.0 - (aur - 0.45) / 0.55) + sin(angle * 2.0 + y * 0.6) * 1.4;
          float wave = exp(-pow(y - front, 2.0) * 0.16);
          vec3 aurCol = mix(getPal(6), getPal(7), 0.5 + 0.5 * sin(y * 0.35 + angle + uTime * 0.45));
          vExtraGlow += aurCol * wave * 0.72 * (1.0 - smoothstep(0.86, 1.0, aur));

          float band1 = pow(0.5 + 0.5 * sin(y * 0.5 - uTime * 0.9 + angle * 1.5), 7.0);
          float aurIdle = smoothstep(0.6, 1.0, aur);
          vExtraGlow += aurCol * band1 * 0.12 * aurIdle;
        }

        vec3 macroN = length(center.xz) > 0.01 ? normalize(vec3(center.x, 0.4 * length(center.xz), center.z)) : vec3(0.0, 1.0, 0.0);
        n = normalize(mix(n, macroN, 0.38));

        float dtPulse = uT - uPulseT;
        if (dtPulse > 0.0 && dtPulse < 4.5) {
          float dP = (uTreeH - y) - dtPulse * 14.0;
          float pulse = exp(-dP * dP * 0.07) * exp(-dtPulse * 0.6);
          vExtraGlow += mix(getPal(6), getPal(7), 0.5 + 0.5 * sin(y * 0.3)) * pulse * 1.35;
        }
      #endif

      #ifdef MODE_ORN
        float wakeT = aData.x;
        float spiralS = aData.y;
        float isProp = step(100.0, aData.z);
        float phase = mod(aData.z, 100.0);
        float oy = aData.w;
        float scanP = smoothstep(0.0, 1.0, clamp((uScanY - oy) / 1.5, 0.0, 1.0));
        float wp = clamp((uT - wakeT) / 0.6, 0.0, 1.0);
        sMul = scanP > 0.001 ? easeOutSoftBack(scanP) * (1.0 + 0.2 * sin(wp * 3.14159265) * step(0.001, wp)) : 0.0;
        localInstPos = instanceMatrix * vec4(position * sMul, 1.0);

        float wakeFlash = (1.0 - wp) * (1.0 - wp) * step(0.001, wp);
        float breath = 0.62 + 0.38 * sin(uTime * 1.5 + phase);
        float stream = pow(0.5 + 0.5 * sin(spiralS * 18.0 - uTime * 2.2), 6.0) * 0.62;
        float awake = step(wakeT, uT);
        vFlash = wakeFlash * mix(0.82, 0.4, isProp) + pow(1.0 - scanP, 2.0) * step(0.001, scanP) * 0.55;
        vec3 lightGlow = vBaseCol * (awake * (0.48 + breath * 0.42 + stream) + (1.0 - awake) * 0.06);
        vec3 propGlow = vBaseCol * (awake * 0.16 + (1.0 - awake) * 0.04);
        vExtraGlow += mix(lightGlow, propGlow, isProp);

        float dtPulseO = uT - uPulseT;
        if (dtPulseO > 0.0 && dtPulseO < 4.5) {
          float dPO = (uTreeH - oy) - dtPulseO * 14.0;
          float pulseO = exp(-dPO * dPO * 0.07) * exp(-dtPulseO * 0.6);
          vExtraGlow += mix(vBaseCol, getPal(6), 0.55) * pulseO * 1.2;
        }
      #endif

      #ifdef MODE_STAR
        float shimmer = 1.0 + 0.14 * sin(uTime * 2.8 + aData.x * 4.0);
        vExtraGlow += vBaseCol * (shimmer * 0.44 + uStarFlash * 1.1);
      #endif

      #ifdef MODE_RUNE
        float rNorm = aData.x;
        float angNorm = fract((aData.y + 3.14159265) / 6.2831853);
        float progress = rNorm * 0.7 + angNorm * 0.3;
        float vis = smoothstep(progress - 0.14, progress + 0.02, uReveal * 1.14) * step(0.001, uReveal);
        sMul = vis > 0.001 ? easeOutCubic(vis) : 0.0;
        localInstPos = instanceMatrix * vec4(position * sMul, 1.0);
        float frontR = exp(-pow((uReveal * 1.14 - progress) * 10.0, 2.0)) * step(0.001, uReveal) * step(uReveal, 0.995);
        vFlash = frontR * 0.85;
        float textBoost = slot == 2 ? 0.42 : 0.26;
        vExtraGlow += vBaseCol * (textBoost + 0.06 * sin(uTime * 1.6 + aData.y)) * uRuneOn;
      #endif

      #ifdef MODE_GIFT
        float startT = aData.x;
        float gp = clamp((uT - startT) / 0.65, 0.0, 1.0);
        sMul = gp > 0.001 ? smoothstep(0.0, 0.28, gp) : 0.0;
        localInstPos = instanceMatrix * vec4(position * sMul, 1.0);
        localInstPos.y += 4.6 * (1.0 - easeSoftDrop(gp));
        for(int i=0;i<6;i++){if(i==int(aData.y+0.5))localInstPos.y+=aData.z*uGiftOpen[i]*1.1;}
      #endif

      #ifdef MODE_WORLD
        float wLight = aData.x;
        if (wLight > 0.5) {
          vExtraGlow += vBaseCol * (0.5 + 0.08 * sin(uTime * 2.2 + center.x));
        }
      #endif

      #ifdef MODE_DEER
        int part = int(aData.x + 0.5);
        float isLower = aData.z;
        float gTime = uTime * 4.4 + aData.w;
        float pitch = 0.075 * cos(gTime);
        vec3 pLocal = localInstPos.xyz;

        if (part >= 2 && part <= 5) {
          float pOff = (part == 2) ? 0.0 : (part == 3 ? 0.55 : (part == 4 ? 3.14159 : 3.69159));
          float hipAng = 0.46 * sin(gTime + pOff);
          float kneeAng = 0.48 * sin(gTime + pOff - 1.05) - 0.14;

          if (isLower > 0.5) {
            vec3 jRot = rotX(aJoint - aPivot, hipAng) + aPivot;
            vec3 relLow = rotX(pLocal - aJoint, hipAng + kneeAng);
            n = rotX(n, hipAng + kneeAng);
            pLocal = jRot + relLow;
          } else {
            pLocal = rotX(pLocal - aPivot, hipAng) + aPivot;
            n = rotX(n, hipAng);
          }
        } else if (part == 1 || part == 6) {
          float headAng = (part == 6 ? -0.05 : -0.03) * sin(gTime + 0.35);
          pLocal = rotX(pLocal - aPivot, headAng) + aPivot;
          n = rotX(n, headAng);
        } else if (part == 7) {
          float tailAng = 0.16 * sin(gTime);
          pLocal = rotX(pLocal - aPivot, tailAng) + aPivot;
          n = rotX(n, tailAng);
        }

        pLocal = rotX(pLocal, pitch);
        n = rotX(n, pitch);
        pLocal.y += 0.1 * sin(gTime);
        localInstPos.xyz = pLocal;
        vExtraGlow += vBaseCol * (slot == 0 ? 0.14 : (slot == 2 ? 0.38 : 0.2 + 0.04 * sin(uTime * 3.5 + aData.y)));
      #endif

      mat3 instNormMat = mat3(instanceMatrix);
      vNormal = normalize(mat3(modelMatrix) * (instNormMat * n));
      vec4 worldPosition = modelMatrix * localInstPos;
      vec4 mvPos = viewMatrix * worldPosition;
      vDepth = -mvPos.z;
      gl_Position = projectionMatrix * mvPos;
    }
  </script>

  <script type="x-shader/x-fragment" id="voxel-fs">
    uniform float uEmissive;

    varying vec3 vNormal;
    varying vec3 vLocal;
    varying vec3 vBaseCol;
    varying float vShade;
    varying float vFlash;
    varying vec3 vExtraGlow;
    varying float vDepth;

    void main() {
      vec3 base = vBaseCol * vShade;

      vec3 N = normalize(vNormal);
      vec3 L = normalize(vec3(-0.78, 0.54, 0.35));
      vec3 R = normalize(vec3(0.75, 0.32, -0.45));
      float diff = 0.08 + 0.92 * max(dot(N, L), 0.0);
      float rim = 0.18 * max(dot(N, R), 0.0);

      vec3 e = abs(vLocal) * 2.0;
      float m1 = max(e.x, max(e.y, e.z));
      float m2 = (e.x + e.y + e.z) - m1 - min(e.x, min(e.y, e.z));
      float edge = smoothstep(0.82, 0.96, m2);

      vec3 col = base * (diff + rim);
      col += edge * 0.22 * base * (0.28 + 0.72 * diff);
      col += base * uEmissive;
      col += vExtraGlow;
      col += vec3(1.0, 0.97, 0.92) * vFlash;

      float fogFactor = 1.0 - exp(-pow(vDepth * 0.0055, 2.0));
      vec3 fogCol = vec3(0.012, 0.020, 0.048);
      col = mix(col, fogCol, clamp(fogFactor, 0.0, 0.85));

      gl_FragColor = vec4(col, 1.0);
    }
  </script>

      float shimmer = 0.55 + 0.45 * sin(vDir.x * 7.0 - vDir.z * 4.5 + uTime * 0.4);

  <script type="x-shader/x-fragment" id="icefloor-fs">
    uniform vec3 uTreeGlow;
    uniform vec3 uRuneGlow;
    uniform float uRuneOn;
    uniform float uTime;

    varying vec3 vWorldPos;

    void main() {
      float dist = length(vWorldPos.xz);

      vec3 col = vec3(0.012, 0.023, 0.025);
      float centerGlow = exp(-dist * dist * 0.015) * (0.28 + 0.72 * uRuneOn);
      float runeHalo = exp(-pow(dist - 6.6, 2.0) * 0.16) * uRuneOn;
      float railHalo = exp(-pow(dist - 11.4, 2.0) * 1.4) * (0.25 + 0.5 * uRuneOn);

      col += uTreeGlow * centerGlow * 0.045;
      col += uRuneGlow * runeHalo * 0.025;
      col += uRuneGlow * railHalo * 0.012;

      vec2 grid = vWorldPos.xz * 7.8;
      vec2 cid = floor(grid);
      vec2 fuv = fract(grid) - 0.5;
      float rnd = fract(sin(dot(cid, vec2(127.1, 311.7))) * 43758.5453);
      float glint = step(0.968, rnd) * smoothstep(0.22, 0.0, length(fuv)) * (0.4 + 0.6 * sin(uTime * 2.2 + rnd * 60.0));
      col += mix(uRuneGlow, vec3(0.75, 0.86, 1.0), 0.5) * glint * 0.24 * (1.0 - smoothstep(11.0, 24.0, dist));

      // 透明渐变消融边缘，彻底消除生硬的水平切割线
      float alpha = 1.0 - smoothstep(13.5, 29.0, dist);
      if (alpha <= 0.002) discard;

      gl_FragColor = vec4(col * alpha, alpha);
    }

      for(let k=0;k<4;k++){
        const front=k<2,side=k%2===0?-1:1;
        const hip=[side*.27,1.5,front?.66:-.68],knee=[side*.3,.79,front?.7:-.91],hoof=[side*.31,.08,front?.86:-.65];

      }
      deerBone([0,1.7,-.85],[0,1.93,-1.25],.08,7);
      const deerMesh=voxels(deer,'DEER',deerPal,.13,deerGroup);deerMesh.name='flying-deer';
      deerGroup.scale.setScalar(.88);
      const fawnGroup=new THREE.Group();scene.add(fawnGroup);
      const fawn=deerMesh.clone();fawnGroup.add(fawn);
      fawnGroup.scale.setScalar(.53);
      function deerPosition(time,target) {

      function pointField(count,vs,fs,uniforms,spread) {

        const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));geo.setAttribute('aSeed',new THREE.BufferAttribute(seeds,3));
        const mesh=new THREE.Points(geo,new THREE.ShaderMaterial({uniforms,vertexShader:$(vs).textContent,fragmentShader:$(fs).textContent,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));

      }
      pointField(400,'sky-vs','sky-fs',{uTime:shared.uTime},()=>{const a=random()*TAU,r=65+random()*20;return [Math.cos(a)*r,8+random()*65,Math.sin(a)*r];});
      const snow=pointField(mobile?500:950,'snow-vs','snow-fs',{uTime:shared.uTime},()=>[(random()-.5)*54,0,(random()-.5)*45]);
      const updraft=pointField(180,'updraft-vs','updraft-fs',{uTime:shared.uTime,uRuneOn:shared.uRuneOn,uColor:{value:palette[2]}},()=>{const a=random()*TAU,r=2+random()*5;return [Math.cos(a)*r,0,Math.sin(a)*r];});
      pointField(45,'lantern-vs','lantern-fs',{uTime:shared.uTime},()=>[(random()-.5)*65,0,-8-random()*28]);
      const fairyCount=mobile?380:700,fairyGeo=new THREE.BufferGeometry(),fairySeeds=new Float32Array(fairyCount*3);
      for(let i=0;i<fairyCount;i++)fairySeeds.set([random(),random(),random()],i*3);
      fairyGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(fairyCount*3),3));
      fairyGeo.setAttribute('aSeed',new THREE.BufferAttribute(fairySeeds,3));
      const fairyMaterial=new THREE.ShaderMaterial({
        uniforms:{uTime:shared.uTime,uT:shared.uT,uJoy:{value:0},uPixelRatio:{value:Math.min(devicePixelRatio,1.5)}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
        vertexShader:`attribute vec3 aSeed;uniform float uTime;uniform float uT;uniform float uJoy;uniform float uPixelRatio;varying float vAlpha;varying float vSpark;
          void main(){float phase=fract(aSeed.x+uTime*(.012+aSeed.y*.008));float y=phase*21.;float a=aSeed.z*6.28318+uTime*.12+y*.18;
          float r=(4.8+aSeed.y*5.8)*(1.-phase*.28);vec3 p=vec3(cos(a)*r,y,sin(a)*r);
          p.x+=sin(uTime*.4+aSeed.x*20.)*.25;float fade=sin(phase*3.14159);vSpark=aSeed.y;
          vAlpha=fade*(.45+.55*pow(.5+.5*sin(uTime*1.5+aSeed.z*40.),4.))*smoothstep(1.,5.,uT)*(1.+uJoy*.6);
          vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=clamp((2.8+aSeed.y*4.5)*uPixelRatio*38./max(1.,-mv.z),1.,14.);gl_Position=projectionMatrix*mv;}`,
        fragmentShader:`varying float vAlpha;varying float vSpark;void main(){vec2 p=gl_PointCoord-.5;float d=length(p);if(d>.5)discard;
          float halo=pow(max(0.,1.-d*2.),3.);float cross=exp(-abs(p.x)*65.)*exp(-abs(p.y)*8.)+exp(-abs(p.y)*65.)*exp(-abs(p.x)*8.);
          float light=mix(halo,halo+cross*.4,step(.8,vSpark));gl_FragColor=vec4(vec3(1.,.76,.39)*2.,light*vAlpha*.7);}`
      });
      const fairies=new THREE.Points(fairyGeo,fairyMaterial);fairies.frustumCulled=false;scene.add(fairies);
      const capacity=2600, particleGeo=new THREE.BufferGeometry();
      const positions=new Float32Array(capacity*3),colors=new Float32Array(capacity*3),sizes=new Float32Array(capacity),alphas=new Float32Array(capacity);
      const life=new Float32Array(capacity),maxLife=new Float32Array(capacity),velocity=new Float32Array(capacity*3);
      particleGeo.setAttribute('position',new THREE.BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage));
      particleGeo.setAttribute('aColor',new THREE.BufferAttribute(colors,3).setUsage(THREE.DynamicDrawUsage));
      particleGeo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1).setUsage(THREE.DynamicDrawUsage));
      particleGeo.setAttribute('aAlpha',new THREE.BufferAttribute(alphas,1).setUsage(THREE.DynamicDrawUsage));
      const particles=new THREE.Points(particleGeo,new THREE.ShaderMaterial({vertexShader:$('particle-vs').textContent,fragmentShader:$('particle-fs').textContent,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
      particles.frustumCulled=false;scene.add(particles);
      let particleCursor=0;
      function emit(pos,vel,color,size=.25,duration=1.8){
        const i=particleCursor++%capacity;positions.set(pos,i*3);velocity.set(vel,i*3);colors.set([color.r,color.g,color.b],i*3);sizes[i]=size;life[i]=maxLife[i]=duration;alphas[i]=.85;
      }
      function burst(pos,count=180){
        for(let i=0;i<count;i++){const a=random()*TAU,v=1+random()*4;emit(pos,[Math.cos(a)*v,random()*5,Math.sin(a)*v],palette[2],.24+random()*.3,1+random()*1.4);}
      }
      let meteors=[],trailAccumulator=0,smokeAccumulator=0,celebrationUntil=0,impactDone=t>=.9,starDone=t>=5.2;
      function openGift(index){if(t<9.8)return;giftUntil[index]=t+2.8;burst(giftCenters[index].clone().add(new THREE.Vector3(0,.65,0)).toArray(),100);}
      function celebrate(){
        if(t<5.2){toast('星星正在点亮');return;}
        if(t<celebrationUntil-3)return;
        celebrationUntil=t+5;wish();
        for(let i=0;i<giftCenters.length;i++){giftUntil[i]=t+2.4+i*.12;burst(giftCenters[i].clone().add(new THREE.Vector3(0,.5,0)).toArray(),55);}
      }
      function wish(){if(t<5.2){toast('星星正在点亮');return;} if(meteors.length>=4)return;meteors.push({age:0,start:new THREE.Vector3(-12+random()*24,30,-8),end:new THREE.Vector3(0,H-.1,0)});}
      function updateParticles(dt){
        for(let i=0;i<capacity;i++){
          if(life[i]<=0){alphas[i]=0;continue;}
          life[i]-=dt;alphas[i]=Math.max(0,life[i]/maxLife[i])*.8;
          for(let j=0;j<3;j++)positions[i*3+j]+=velocity[i*3+j]*dt;
          velocity[i*3+1]-=.65*dt;
        }
        for(const name of ['position','aColor','aSize','aAlpha'])particleGeo.attributes[name].needsUpdate=true;
      }
      // The only 2D drawing is a text mask, sampled into real instanced cubes.
      let plaque;
      function updatePlaque(){
        if(plaque){scene.remove(plaque);plaque.geometry.dispose();plaque.material.dispose();}
        const canvas=document.createElement('canvas');canvas.width=720;canvas.height=56;
        const ctx=canvas.getContext('2d');ctx.font='bold 30px monospace';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText($('plaque-input').value,360,38);
        const pixels=ctx.getImageData(0,0,720,56).data,list=[];
        for(let y=0;y<56;y+=2)for(let x=0;x<720;x+=2)if(pixels[(y*720+x)*4+3]>128){
          addVoxel(list,(x-360)*.019,.06,8.9+(y-28)*.026,.029,2,.9,[.7,0,0,0]);
        }
        plaque=voxels(list,'RUNE',palette,.17);plaque.visible=plaqueOn;
      }
      updatePlaque();
      function replay(){
        t=0;impactDone=false;starDone=false;meteors=[];life.fill(0);alphas.fill(0);shared.uPulseT.value=-100;trailAccumulator=0;giftUntil.fill(0);shared.uGiftOpen.value.fill(0);trainBoostUntil=0;deerGreetUntil=0;celebrationUntil=0;
        lastInteraction=performance.now();
      }
      $('replay-btn').onclick=replay;$('fw-btn').onclick=celebrate;
      $('snow-btn').setAttribute('aria-pressed','true');
      $('snow-btn').onclick=()=>{snowOn=!snowOn;snow.visible=snowOn;$('snow-btn').classList.toggle('on',snowOn);$('snow-btn').setAttribute('aria-pressed',String(snowOn));};
      function editPlaque(force){
        const open=force??!$('plaque-box').classList.contains('open');
        $('plaque-box').classList.toggle('open',open);$('plaque-box').inert=!open;
        $('text-btn').setAttribute('aria-expanded',String(open));
        if(open)$('plaque-input').focus();else $('text-btn').focus();
      }
      $('text-btn').setAttribute('aria-expanded','false');$('text-btn').onclick=()=>editPlaque();
      let plaqueTimer;
      $('plaque-input').addEventListener('input',()=>{clearTimeout(plaqueTimer);plaqueTimer=setTimeout(updatePlaque,100);});
      $('plaque-input').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();e.stopPropagation();editPlaque(false);}});
      $('plaque-eye').onclick=()=>{plaqueOn=!plaqueOn;plaque.visible=plaqueOn;$('plaque-eye').classList.toggle('muted',!plaqueOn);$('plaque-eye').setAttribute('aria-pressed',String(plaqueOn));};
      $('snap-btn').onclick=()=>{
        try{composer.render();renderer.domElement.toBlob(blob=>{if(!blob){toast('暂时无法保存画面');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Winter-Wish.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);},'image/png');}catch{toast('暂时无法保存画面');}
      };
      const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),activePointers=new Set();let pointerStart=null,multiTouch=false;
      renderer.domElement.addEventListener('pointerdown',e=>{activePointers.add(e.pointerId);if(activePointers.size>1){multiTouch=true;pointerStart=null;return;}pointerStart={x:e.clientX,y:e.clientY,time:performance.now(),id:e.pointerId};});
      renderer.domElement.addEventListener('pointercancel',e=>{activePointers.delete(e.pointerId);pointerStart=null;if(activePointers.size===0)multiTouch=false;});
      renderer.domElement.addEventListener('pointerup',e=>{
        activePointers.delete(e.pointerId);
        if(multiTouch){pointerStart=null;if(activePointers.size===0)multiTouch=false;return;}
        if(!pointerStart||e.pointerId!==pointerStart.id)return;
        const start=pointerStart;pointerStart=null;
        if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>7||performance.now()-start.time>550)return;
        pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);raycaster.setFromCamera(pointer,camera);
        const starPos=new THREE.Vector3();starGroup.getWorldPosition(starPos);
        const deerHit=deerGroup.position.clone().add(new THREE.Vector3(0,1.5,0));
        const giftIndex=t>9.8?giftCenters.findIndex(c=>raycaster.ray.distanceToPoint(c)<.85):-1;
        const trainHit=trainCars.some(car=>raycaster.ray.distanceToPoint(car.position.clone().add(new THREE.Vector3(0,.5,0)))<.75);
        if(t>5.2&&raycaster.ray.distanceToPoint(starPos)<1.25){celebrate();}
        else if(t>9.8&&giftIndex>=0)openGift(giftIndex);
        else if(t>9.8&&trainHit){trainBoostUntil=t+4;burst(trainCars[0].position.toArray(),75);}
        else if(t>9.8&&raycaster.ray.distanceToPoint(deerHit)<1.7){deerGreetUntil=t+3;burst(deerHit.toArray(),100);}
        else {
          const hit=new THREE.Vector3();const intersects=raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),hit);
          if(intersects&&plaqueOn&&Math.abs(hit.x)<6&&hit.z>8.1&&hit.z<10.1)editPlaque(true);else wish();
        }
      });
      renderer.domElement.addEventListener('pointermove',e=>{
        if(e.buttons)return;
        pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);raycaster.setFromCamera(pointer,camera);
        const hoverStar=t>5.2&&raycaster.ray.distanceToPoint(starGroup.position)<1.25;
        const hoverGift=t>9.8&&giftCenters.some(c=>raycaster.ray.distanceToPoint(c)<.85);
        const hoverDeer=t>9.8&&raycaster.ray.distanceToPoint(deerGroup.position.clone().add(new THREE.Vector3(0,1.5,0)))<1.7;
        const hoverTrain=t>9.8&&trainCars.some(c=>raycaster.ray.distanceToPoint(c.position.clone().add(new THREE.Vector3(0,.5,0)))<.75);
        renderer.domElement.style.cursor=hoverStar||hoverGift||hoverDeer||hoverTrain?'pointer':'grab';
      });
      addEventListener('keydown',e=>{
        if(e.target.closest('input,textarea,button,[contenteditable="true"]'))return;
        if(e.code==='Space'){e.preventDefault();replay();}
        
        if(e.key==='g'||e.key==='G')openGift(Math.floor(random()*6));
        if(e.key==='Escape')editPlaque(false);
      });
      // A fixed score and audio-clock scheduling prevent random notes and timer drift.
      let audioContext,master,musicOn=false,musicTimer,nextNote=0,noteIndex=0;
      const score=[
        [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,4],
        [77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],[76,1],[74,1],[74,1],[76,1],[74,2],[79,2],
        [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,4],
        [77,1],[77,1],[77,1],[77,1],[77,1],[76,1],[76,1],[76,.5],[76,.5],[79,1],[79,1],[77,1],[74,1],[72,4],[0,4]
      ];
      function playNote(midi,at,duration){
        if(!midi)return;
        const freq=440*Math.pow(2,(midi-69)/12);
        for(const [ratio,level] of [[1,.19],[2,.035],[3,.009]]){
          const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=freq*ratio;
          gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(level,at+.012);gain.gain.exponentialRampToValueAtTime(.0001,at+Math.min(1.7,duration*.85+.25));
          osc.connect(gain).connect(master);osc.start(at);osc.stop(at+Math.min(1.8,duration+.35));osc.onended=()=>{osc.disconnect();gain.disconnect();};
        }
      }
      function scheduleMusic(){
        if(!musicOn||document.hidden||audioContext.state!=='running')return;
        if(nextNote<audioContext.currentTime-.1)nextNote=audioContext.currentTime+.05;
        while(nextNote<audioContext.currentTime+.25){const [note,beats]=score[noteIndex];playNote(note,nextNote,beats*.36);nextNote+=beats*.36;noteIndex=(noteIndex+1)%score.length;}
      }
      $('music-btn').setAttribute('aria-pressed','false');
      $('music-btn').onclick=async()=>{
        const button=$('music-btn');button.disabled=true;
        try{
          if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)();master=audioContext.createGain();master.gain.value=.48;master.connect(audioContext.destination);}
          if(musicOn){musicOn=false;clearInterval(musicTimer);await audioContext.suspend();}
          else {await audioContext.resume();musicOn=true;if(nextNote===0)nextNote=audioContext.currentTime+.05;scheduleMusic();musicTimer=setInterval(scheduleMusic,70);}
          button.classList.toggle('on',musicOn);button.setAttribute('aria-pressed',String(musicOn));
        }catch(error){musicOn=false;clearInterval(musicTimer);button.classList.remove('on');button.setAttribute('aria-pressed','false');toast('这个浏览器暂时无法播放音乐');console.warn(error);}finally{button.disabled=false;}
      };
      let resizeTimer;
      addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);frameCamera();},100);});
      document.addEventListener('visibilitychange',()=>{
        lastFrame=performance.now();
        if(audioContext&&musicOn){if(document.hidden)audioContext.suspend();else audioContext.resume().catch(()=>{});}
      });
      const deerNext=new THREE.Vector3(),meteorPos=new THREE.Vector3();
      function render(now){
        requestAnimationFrame(render);
        const dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;
        if(document.hidden)return;
        const delta=paused?0:dt;
        t+=delta;worldTime+=reduced?0:delta;
        shared.uTime.value=worldTime;shared.uT.value=t;
        shared.uScanY.value=-2+clamp((t-1.8)/3.4)*(H+4);
        shared.uReveal.value=smooth((t-.9)/1.1);shared.uRuneOn.value=smooth((t-.9)/1.1);
        shared.uAurora.value=clamp((t-5.2)/3.3);shared.uStarFlash.value=Math.max(0,1-(t-5.2)/.9);
        const mix=paused?1:1-Math.exp(-dt*3.2);palette.forEach((color,i)=>color.lerp(paletteTarget[i],mix));
        starGroup.visible=t>=5.2;starGroup.scale.setScalar(Math.max(.001,smooth((t-5.2)/.65)));
        starGroup.rotation.y=Math.atan2(camera.position.x,camera.position.z)+Math.sin(worldTime*.35)*.2;starGroup.rotation.z=Math.sin(worldTime*.45)*.04;flare.quaternion.copy(camera.quaternion);flare.rotateY(-starGroup.rotation.y);
        rings.forEach((ring,i)=>ring.rotation.y=worldTime*(i%2?-.025:.018));
        scan.visible=t>1.8&&t<5.35;
        const scanY=Math.max(0,shared.uScanY.value-.75),scanRadius=Math.max(.5,branchRadius(scanY)+.5);
        scan.position.y=scanY;scan.scale.setScalar(scanRadius);scan.material.uniforms.uOpacity.value=.55*Math.sin(clamp((t-1.8)/3.55)*Math.PI);
        worldMesh.visible=t>1.3;canopyMesh.visible=t>1.3;
        starOrbit.visible=t<celebrationUntil;starOrbit.rotation.y=worldTime*.35;fairyMaterial.uniforms.uJoy.value=smooth((celebrationUntil-t)/2);
        flare.material.uniforms.uIntensity.value=.58+.08*Math.sin(worldTime*1.2);
        for(let i=0;i<6;i++)shared.uGiftOpen.value[i]+=((t<giftUntil[i]?1:0)-shared.uGiftOpen.value[i])*(1-Math.exp(-dt*6));
        trainAngle+=reduced?0:delta*(t<trainBoostUntil?.52:.14);
        trainCars.forEach((car,i)=>{const angle=trainAngle-i*.16;car.position.set(Math.sin(angle)*9.55,.02,Math.cos(angle)*9.55);car.rotation.y=angle+Math.PI/2;car.visible=t>9.5;car.scale.setScalar(smooth((t-9.5)/1.1));});
        if(t>9.5&&!reduced){
          smokeAccumulator+=delta*7;
          while(smokeAccumulator>=1){smokeAccumulator--;const c=trainCars[0];emit([c.position.x,1.3,c.position.z],[.12,.6,0],new THREE.Color('#748087'),.4,1.4);}
        }
        if(!impactDone&&t>=.9){burst([0,.2,0],340);impactDone=true;}
        if(!starDone&&t>=5.2){burst([0,H-.1,0],100);starDone=true;}
        if(t<.9){
          const y=27*(1-Math.pow(clamp(t/.9),2));
          for(let j=0;j<5;j++)emit([(random()-.5)*.16,y+random()*.65,0],[0,.5,0],palette[2],.3,.45);
        }
        deerGroup.visible=t>8.5;fawnGroup.visible=t>9.2;
        if(fawnGroup.visible){deerPosition(worldTime-1.8,fawnGroup.position);deerPosition(worldTime-1.75,deerNext);fawnGroup.lookAt(deerNext);fawnGroup.position.y-=.9;fawnGroup.scale.setScalar(.53*smooth((t-9.2)/1.2));}
        if(deerGroup.visible){
          deerPosition(worldTime,deerGroup.position);deerPosition(worldTime+.05,deerNext);deerGroup.lookAt(deerNext);
          if(t<deerGreetUntil)deerGroup.rotation.z+=Math.sin((deerGreetUntil-t)*TAU)*.12;
          deerGroup.scale.setScalar(.88*smooth((t-8.5)/1.2));
          if(!reduced){trailAccumulator+=delta*110;while(trailAccumulator>=1){trailAccumulator--;emit([deerGroup.position.x+(random()-.5)*.3,deerGroup.position.y+1.2,deerGroup.position.z],[0,-.2,0],palette[2],.25+random()*.25,1.7+random());}}
        }
        for(const meteor of meteors){
          meteor.age+=delta;meteorPos.lerpVectors(meteor.start,meteor.end,clamp(meteor.age/.9));
          if(delta>0)for(let i=0;i<8;i++)emit([meteorPos.x+(random()-.5)*.18,meteorPos.y+(random()-.5)*.18,meteorPos.z],[0,.4,0],palette[2],.22,.55);
          if(meteor.age>=.9&&!meteor.hit){meteor.hit=true;shared.uPulseT.value=t;burst(meteor.end.toArray(),180);}
        }
        meteors=meteors.filter(m=>m.age<1);
        updateParticles(delta);finishing.uniforms.uTime.value=worldTime;
        controls.autoRotate=!reduced&&!paused&&now-lastInteraction>5000;
        controls.update(delta);composer.render();
      }
      requestAnimationFrame(render);
    } catch(error) {clearTimeout(loadingTimer);fail(error);}

  </script>
